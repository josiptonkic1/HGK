<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0c0a07">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zlatna kuna">
  <title>Prijava osoblja – 31. Zlatna kuna</title>
  <link rel="stylesheet" href="/vendor/fontsource/montserrat/600.css">
  <link rel="stylesheet" href="/vendor/fontsource/montserrat/700.css">
  <link rel="stylesheet" href="/vendor/fontsource/raleway/400.css">
  <link rel="stylesheet" href="/vendor/fontsource/raleway/600.css">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/login.js"></script>
</head>
<body class="invite">
  <main class="login-card">
    <div id="logo"></div>
    <form id="login-form" class="rsvp" novalidate>
      <h2 class="gold-text">Prijava za osoblje</h2>
      <p class="lead">Administratori i moderatori</p>
      <div id="login-error" class="alert alert-err" role="alert" hidden></div>
      <div class="field">
        <label for="username">Korisničko ime</label>
        <input type="text" id="username" autocomplete="username" autocapitalize="none" required>
      </div>
      <div class="field">
        <label for="password">Lozinka</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-gold btn-block btn-lg">Prijava</button>
    </form>
  </main>
</body>
</html>
