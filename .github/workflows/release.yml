# Objavljuje:
#   - stranicu pozivnice na GitHub Pages:   https://josiptonkic1.github.io/HGK/
#   - Android aplikaciju na Releases:        .../releases/latest/download/zlatna-kuna.apk
# Bez poslužitelja: QR kod nosi ime i pratnju, aplikacija sprema dolaske na mobitelu.
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'pozivnica/**'
      - 'mobile/**'
      - 'public/css/**'
      - 'public/img/**'
      - 'test/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    # ubuntu-24.04 slika već sadrži Android SDK (ANDROID_HOME)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Paketi
        run: |
          npm ci
          (cd mobile && npm ci)

      - name: Testovi
        run: npm test

      - name: Biblioteke i fontovi (pozivnica + aplikacija)
        working-directory: mobile
        run: npm run vendor

      # ---------- stranica pozivnice + web aplikacija za ulaz ----------
      - name: Web aplikacija za ulaz u /ulaz
        run: cp -r mobile/www pozivnica/ulaz

      - name: Objava stranice pozivnice (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pozivnica
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Pozivnica'

      # ---------- Android ----------
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        run: |
          test -d "$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # Jednom se generira stalni ključ za potpis i sprema u repozitorij,
      # da svi budući APK-ovi imaju isti potpis (ažuriranje bez brisanja stare verzije).
      - name: Ključ za potpis APK-a
        run: |
          KS=mobile/android/app/zk-debug.keystore
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass android -keypass android \
              -alias zlatnakuna -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Zlatna kuna, O=HGK, C=HR"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$KS"
            git commit -m "Stalni testni kljuc za potpis APK-a [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build APK
        working-directory: mobile
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../zlatna-kuna.apk

      - name: Objava na Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: 31. Zlatna kuna – Android aplikacija 2.0.${{ github.run_number }}
          make_latest: true
          files: zlatna-kuna.apk
          body: |
            ## 31. Zlatna kuna – Android aplikacija (bez poslužitelja)

            **Preuzimanje:** `zlatna-kuna.apk` – otvorite na mobitelu i dopustite instalaciju iz nepoznatog izvora.

            **Link pozivnice za uzvanike:** https://josiptonkic1.github.io/HGK/
            Uzvanik upiše ime, prezime i pratnju i dobije QR kod u kojem su zapisani ti podaci.

            **Na ulazu:** aplikacija skenira QR kod, prikaže ime i pratnju, a „Preuzeo pozivnicu” sprema dolazak na mobitel.
            Izvoz u Excel i PDF nalazi se pod Admin (zaštićeno PIN-om).

            _Testna (debug) verzija._
