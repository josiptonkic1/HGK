<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0a07">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src *; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Zlatna kuna</title>
  <link rel="stylesheet" href="app.css">
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="wrap">
    <div class="logo" aria-label="31. Zlatna kuna">
      <span class="num">31.</span>
      <span class="word">ZLATNA<br>KUNA</span>
    </div>
    <p class="sub">Ulaz i skeniranje pozivnica</p>

    <div id="checking" class="card center">
      <div class="spinner" aria-hidden="true"></div>
      <p>Spajanje…</p>
    </div>

    <div id="failed" class="card center" hidden>
      <h1>Nije moguće spojiti se</h1>
      <div id="error" class="error" role="alert"></div>
      <button type="button" id="retry">Pokušaj ponovno</button>
    </div>
  </main>
</body>
</html>
