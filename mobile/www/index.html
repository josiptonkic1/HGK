<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0a07">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src *; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Zlatna kuna</title>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="wrap">
    <div class="logo" aria-label="31. Zlatna kuna">
      <span class="num">31.</span>
      <span class="word">ZLATNA<br>KUNA</span>
    </div>
    <p class="sub">Ulaz i skeniranje pozivnica</p>

    <div id="checking" class="card center" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p>Spajanje na poslužitelj…</p>
      <p class="hint" id="checking-url"></p>
    </div>

    <form id="setup" class="card" novalidate hidden>
      <h1>Adresa poslužitelja</h1>
      <p class="hint">Upišite adresu na kojoj radi aplikacija Zlatna kuna (dobit ćete je od administratora), npr. <code>https://zlatnakuna.hgk.hr</code>.</p>
      <div id="error" class="error" role="alert" hidden></div>
      <label for="url">Adresa</label>
      <input id="url" type="url" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" placeholder="https://…" required>
      <button type="submit" id="connect">Spoji se</button>
      <p class="hint small">Adresa se pamti; kasnije je možete promijeniti u aplikaciji (gumb „Poslužitelj”).</p>
    </form>
  </main>
</body>
</html>
